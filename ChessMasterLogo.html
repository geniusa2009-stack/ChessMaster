<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ChessMaster — Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green-light:#81b64c;
    --green-deep:#769656;
    --off-white:#eeeed2;
    --white:#ffffff;
    --dark:#312e2b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--dark);
    color:var(--off-white);
    font-family:'Poppins','Segoe UI',system-ui,sans-serif;
    min-height:100vh;
    padding:48px;
    display:flex;
    flex-direction:column;
    gap:44px;
  }
  h1{font-size:18px;font-weight:700;opacity:.6;letter-spacing:.04em}
  .row{display:flex;align-items:center;gap:40px;flex-wrap:wrap}
  .card{
    display:flex;flex-direction:column;gap:14px;align-items:center;
    padding:28px;border-radius:18px;background:rgba(255,255,255,.03);
    border:1px solid rgba(238,238,210,.08);
  }
  .label{font-size:12px;opacity:.45}

  /* ---------- Icon + Typography lockup ---------- */
  .lockup{display:inline-flex;align-items:center;gap:16px}
  .wordmark{font-weight:800;letter-spacing:-.02em;white-space:nowrap;font-size:40px}
  .wordmark .c{color:var(--off-white)}
  .wordmark .m{color:var(--green-light)}
</style>
</head>
<body>

  <h1>ChessMaster — Logo System</h1>

  <div class="row">

    <!-- ===== 1) ICON ONLY ===== -->
    <div class="card">
      <svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="ChessMaster" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#81b64c"/>
            <stop offset="100%" stop-color="#769656"/>
          </linearGradient>
        </defs>

        <!-- rounded board tile -->
        <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#tile)"/>
        <rect x="6" y="6" width="108" height="108" rx="26" fill="none" stroke="#eeeed2" stroke-opacity="0.18" stroke-width="2"/>

        <!-- checker accent -->
        <g opacity="0.16" fill="#312e2b">
          <rect x="18" y="84" width="9" height="9"/>
          <rect x="27" y="93" width="9" height="9"/>
        </g>

        <!-- knight -->
        <g fill="#eeeed2">
          <polygon points="66,22 79,33 82,52 76,64 81,80 86,92 40,92 43,78 35,70 26,64 21,57 29,49 37,44 41,34 50,26"/>
          <polygon points="34,92 86,92 90,104 30,104"/>
          <circle cx="46" cy="44" r="3.4" fill="#769656"/>
        </g>
      </svg>
      <div class="label">Icon Only</div>
    </div>

    <!-- ===== 2) ICON + TYPOGRAPHY ===== -->
    <div class="card">
      <div class="lockup">
        <svg width="64" height="64" viewBox="0 0 120 120" role="img" aria-label="ChessMaster" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="tile2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#81b64c"/>
              <stop offset="100%" stop-color="#769656"/>
            </linearGradient>
          </defs>
          <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#tile2)"/>
          <rect x="6" y="6" width="108" height="108" rx="26" fill="none" stroke="#eeeed2" stroke-opacity="0.18" stroke-width="2"/>
          <g opacity="0.16" fill="#312e2b">
            <rect x="18" y="84" width="9" height="9"/>
            <rect x="27" y="93" width="9" height="9"/>
          </g>
          <g fill="#eeeed2">
            <polygon points="66,22 79,33 82,52 76,64 81,80 86,92 40,92 43,78 35,70 26,64 21,57 29,49 37,44 41,34 50,26"/>
            <polygon points="34,92 86,92 90,104 30,104"/>
            <circle cx="46" cy="44" r="3.4" fill="#769656"/>
          </g>
        </svg>
        <span class="wordmark"><span class="c">Chess</span><span class="m">Master</span></span>
      </div>
      <div class="label">Icon + Typography</div>
    </div>

  </div>
</body>
</html>
